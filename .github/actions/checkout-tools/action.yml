name: Checkout 4D Tools (hardened)
description: >
  Clone 4eDimension/Tools with HTTP/1.1, hard per-attempt timeouts, stalled-transfer
  abort, disabled credential helpers, retries, and a final non-partial-clone fallback.
  Prevents 6h job hangs when git-remote-http stalls mid-clone.

inputs:
  token:
    description: GitHub token with access to 4eDimension/Tools
    required: true
  ref:
    description: Branch or tag (usually vars.VERSION4D)
    required: true
  path:
    description: Destination path under GITHUB_WORKSPACE
    required: false
    default: tools
  sparse-paths:
    description: Newline-separated sparse-checkout cone paths
    required: true
  repository:
    description: Tools repository (owner/name)
    required: false
    default: 4eDimension/Tools
  clone-timeout-sec:
    description: Hard timeout (seconds) for each git clone attempt
    required: false
    default: "600"

runs:
  using: composite
  steps:
    - name: Checkout Tools (macOS / Linux)
      if: runner.os != 'Windows'
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        REF: ${{ inputs.ref }}
        DEST: ${{ inputs.path }}
        SPARSE: ${{ inputs.sparse-paths }}
        REPO: ${{ inputs.repository }}
        CLONE_TIMEOUT_SEC: ${{ inputs.clone-timeout-sec }}
        SPARSE_TIMEOUT_SEC: ${{ inputs.clone-timeout-sec }}
      run: bash "${{ github.action_path }}/checkout-tools.sh"

    # Self-hosted Windows often resolves `bash` to WSL (system32\bash.exe), which
    # fails under Local System. Force Git Bash instead.
    - name: Checkout Tools (Windows / Git Bash)
      if: runner.os == 'Windows'
      shell: cmd
      env:
        TOKEN: ${{ inputs.token }}
        REF: ${{ inputs.ref }}
        DEST: ${{ inputs.path }}
        SPARSE: ${{ inputs.sparse-paths }}
        REPO: ${{ inputs.repository }}
        CLONE_TIMEOUT_SEC: ${{ inputs.clone-timeout-sec }}
        SPARSE_TIMEOUT_SEC: ${{ inputs.clone-timeout-sec }}
      run: |
        if exist "C:\Program Files\Git\bin\bash.exe" (
          "C:\Program Files\Git\bin\bash.exe" --noprofile --norc -eo pipefail "%GITHUB_ACTION_PATH%\checkout-tools.sh"
        ) else (
          echo Git Bash not found at C:\Program Files\Git\bin\bash.exe
          exit /b 1
        )
