name: Checkout 4D Tools (hardened)
description: >
  Clone 4eDimension/Tools with HTTP/1.1, retries, and a final non-partial-clone
  fallback. Avoids intermittent curl 92 / early EOF / promisor-remote failures
  seen on self-hosted Windows when fetching large tool4d_* blobs via HTTP/2
  partial clones.

inputs:
  token:
    description: GitHub token with access to 4eDimension/Tools
    required: true
  ref:
    description: Branch or tag (usually vars.VERSION4D)
    required: true
  path:
    description: Destination path under GITHUB_WORKSPACE
    required: false
    default: tools
  sparse-paths:
    description: Newline-separated sparse-checkout cone paths
    required: true
  repository:
    description: Tools repository (owner/name)
    required: false
    default: 4eDimension/Tools

runs:
  using: composite
  steps:
    - name: Harden git + checkout Tools with retries
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        REF: ${{ inputs.ref }}
        DEST: ${{ inputs.path }}
        SPARSE: ${{ inputs.sparse-paths }}
        REPO: ${{ inputs.repository }}
      run: |
        set -euo pipefail

        # HTTP/2 stream resets (curl 92) are common on large GitHub fetches from
        # self-hosted Windows runners. Force HTTP/1.1 + large buffers.
        git config --global http.version HTTP/1.1
        git config --global http.postBuffer 524288000
        git config --global http.lowSpeedLimit 0
        git config --global http.lowSpeedTime 999999
        git config --global core.compression 0

        DEST_ABS="${GITHUB_WORKSPACE}/${DEST}"
        URL="https://x-access-token:${TOKEN}@github.com/${REPO}.git"

        # Build sparse path args (newline / CR safe)
        SPARSE_ARGS=()
        while IFS= read -r line || [ -n "$line" ]; do
          line="$(echo "$line" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [ -n "$line" ] || continue
          SPARSE_ARGS+=("$line")
        done <<< "$SPARSE"

        if [ "${#SPARSE_ARGS[@]}" -eq 0 ]; then
          echo "❌ sparse-paths vide"
          exit 1
        fi

        attempt=1
        max_attempts=5
        delay=15

        while [ "$attempt" -le "$max_attempts" ]; do
          echo "📦 Checkout ${REPO}@${REF} → ${DEST} (attempt ${attempt}/${max_attempts})"
          rm -rf "${DEST_ABS}"

          clone_ok=0
          if [ "$attempt" -lt "$max_attempts" ]; then
            # Fast path: partial clone + sparse (may flake on HTTP/2 / promisor fetch)
            if git clone --depth 1 --single-branch --branch "${REF}" --sparse \
                --filter=blob:none \
                "${URL}" "${DEST_ABS}"; then
              clone_ok=1
            fi
          else
            # Last resort: no blob filter — downloads needed trees/blobs in one shot
            echo "⚠️ Dernier essai SANS --filter=blob:none (plus fiable)"
            if git clone --depth 1 --single-branch --branch "${REF}" --sparse \
                "${URL}" "${DEST_ABS}"; then
              clone_ok=1
            fi
          fi

          if [ "$clone_ok" -eq 1 ]; then
            if (
              cd "${DEST_ABS}"
              git sparse-checkout set --cone "${SPARSE_ARGS[@]}"
              # Materialize / verify working tree
              git checkout -f "HEAD"
            ); then
              echo "✅ Tools checkout OK (${DEST})"
              exit 0
            fi
            echo "⚠️ sparse-checkout / checkout a échoué"
          else
            echo "⚠️ git clone a échoué"
          fi

          rm -rf "${DEST_ABS}"
          if [ "$attempt" -eq "$max_attempts" ]; then
            break
          fi
          echo "⏳ Retry dans ${delay}s..."
          sleep "$delay"
          attempt=$((attempt + 1))
          delay=$((delay * 2))
          if [ "$delay" -gt 60 ]; then delay=60; fi
        done

        echo "❌ Impossible de cloner ${REPO}@${REF} après ${max_attempts} tentatives"
        exit 1
