name: Codesign Product
description: Submit product to notary

inputs:
  sign:
    required: true
    type: string
  keychain:
    required: true
    type: string
  apple_id:
    required: true
    type: string 
  team_id:
    required: true
    type: string 
  password:
    required: true
    type: string 
  product_path:
    required: true
    type: string
  dmg_path:
    required: true
    type: string
  dmg_exists:
    required: false
    type: boolean
    default: false
  # When false, skip DMG creation (sign product only — used to FTP Client before notary).
  create_dmg:
    required: false
    type: boolean
    default: true
  # When false, skip Apple notary + staple (pair with create_dmg=false on Build job).
  notarize:
    required: false
    type: boolean
    default: true
  # When false, skip CEF normalize + Codesign (DMG/notary only — product already signed).
  sign_product:
    required: false
    type: boolean
    default: true
  # When false, skip étape 2 archive discovery (nested + sibling). Use on SignApp when
  # Sign-Client-Archive already signed update.mac.4darchive for Server/FTP.
  sign_archives:
    required: false
    type: boolean
    default: true

outputs:
  product_path: 
    value: ${{ inputs.product_path }}
  dmg_path: 
    value: ${{ inputs.dmg_path }}
  notarization_status:
    value: ${{ steps.notarytool-wait.outputs.notarization_status || steps.notarytool-skip.outputs.notarization_status }}

runs:
  using: "composite"
  steps:

    - name: setup
      id: setup
      run: |
        echo "dmg_path=${{ inputs.dmg_path }}" >> $GITHUB_OUTPUT
        curl "${entitlements_url}" -o entitlements.plist -sL
        echo "entitlements_path=${GITHUB_WORKSPACE}/entitlements.plist" >> $GITHUB_OUTPUT
      shell: bash
      env:
        path: ${{ inputs.product_path }}
        entitlements_url: 'https://raw.githubusercontent.com/miyako/4D/v1/entitlements.plist'

    # Only normalize the product being signed — never tools/ or the whole workspace.
    # Scanning GITHUB_WORKSPACE used to ditto CEF into tool4d_* copies (useless) and
    # could mutate a sibling Client.app during Archive ZIP codesign.
    #
    # NEVER fat-normalize update*.4darchive: clonefile CEF into helpers balloons the
    # archive and turns SignArchive into a multi-hour SignApp (ATE v20 hung 3h+).
    # Archives stay slim (relative CEF symlinks) — see normalize_helpers_slim_under.
    - name: Normalize WebViewerCEF helpers (product only)
      if: ${{ inputs.sign_product != 'false' }}
      shell: bash
      env:
        PRODUCT_PATH: ${{ inputs.product_path }}
      run: |
        set -euo pipefail
        shopt -s nullglob

        # Keep GHA runner alive during long CEF copies (prevents lost communication).
        heartbeat() { while true; do echo "… CEF normalize alive $(date -u +%H:%M:%S)"; sleep 60; done; }
        heartbeat &
        HB_PID=$!
        trap 'kill $HB_PID 2>/dev/null || true' EXIT

        product_path="${PRODUCT_PATH%/}"
        if [ ! -d "$product_path" ]; then
          echo "ℹ️ Skip CEF normalize (product n'est pas un dossier): $product_path"
          exit 0
        fi

        # Fat CEF copies are for notarized .app only — never for update archives.
        case "$product_path" in
          *.4darchive|*.4darchive/)
            echo "⏭️ Skip fat CEF normalize on .4darchive (slim symlinks only — Codesign step)"
            exit 0
            ;;
        esac

        echo "🔎 Scan WebViewerCEF sous le produit uniquement: $product_path"

        # Fast path: if no helper still has an EXE or CEF symlink, do not touch anything
        # (avoids invalidating intact Developer ID seals → far more codesign skips later).
        SYMS=$(find "$product_path" -type l \( \
          -path '*/4D Helper*.app/Contents/MacOS/*' -o \
          -path '*/4D Helper*.app/Contents/Frameworks/Chromium Embedded Framework.framework' \
        \) -print -quit 2>/dev/null || true)
        if [ -z "$SYMS" ]; then
          # Also need a real CEF dir when helpers exist (missing CEF still requires fix)
          MISSING_CEF=0
          while IFS= read -r -d '' APP; do
            DEST_CEF="$APP/Contents/Frameworks/Chromium Embedded Framework.framework"
            if [ ! -d "$DEST_CEF" ]; then
              MISSING_CEF=1
              break
            fi
          done < <(find "$product_path" -type d -name "4D Helper*.app" -print0 2>/dev/null)
          if [ "$MISSING_CEF" -eq 0 ]; then
            echo "⏭️ Helpers déjà normalisés (pas de symlink EXE/CEF) — skip CEF normalize"
            exit 0
          fi
        fi

        py_resolve='import os,sys; base=sys.argv[1]; tgt=sys.argv[2]; print(os.path.abspath(os.path.join(base, tgt)))'

        FOUND=0
        MUTATED=0
        while IFS= read -r -d '' BUNDLE_ROOT; do
          FOUND=1
          echo "📦 Bundle: $BUNDLE_ROOT"

          SRC_CEF="${BUNDLE_ROOT}/Chromium Embedded Framework.framework"
          if [ ! -d "$SRC_CEF" ]; then
            echo "❌ CEF introuvable dans $BUNDLE_ROOT"; exit 1
          fi

          while IFS= read -r -d '' APP; do
            NAME="$(basename "$APP" .app)"
            EXE="$APP/Contents/MacOS/$NAME"
            DEST_CEF="$APP/Contents/Frameworks/Chromium Embedded Framework.framework"

            need_exe=0
            need_cef=0
            [ -L "$EXE" ] && need_exe=1
            if [ -L "$DEST_CEF" ] || [ ! -d "$DEST_CEF" ]; then
              need_cef=1
            fi
            if [ "$need_exe" -eq 0 ] && [ "$need_cef" -eq 0 ]; then
              echo "⏭️ Helper OK (déjà local): $APP"
              continue
            fi

            # 1) L'exécutable principal ne doit pas être un symlink
            if [ "$need_exe" -eq 1 ]; then
              TGT="$(readlink "$EXE")"
              RESOLVED=$(python3 -c "$py_resolve" "$(dirname "$EXE")" "$TGT")
              if [ ! -f "$RESOLVED" ]; then
                echo "❌ Cible du symlink introuvable: $EXE -> $TGT"; exit 1
              fi
              echo "🪄 Remplace symlink exécutable: $EXE  (-> $TGT)"
              rm -f "$EXE"
              /usr/bin/ditto "$RESOLVED" "$EXE"
              chmod 755 "$EXE"
              MUTATED=$((MUTATED + 1))
            fi

            # 2) Each helper needs a local CEF framework (notary rejects external symlinks).
            # Prefer APFS clonefile (cp -c): distinct inodes (OK for Apple notary) + CoW
            # (far less I/O than ditto). NEVER hardlink (cp -al) — notary Invalid on shared
            # inodes across 4D Helper*.app (AutoTestExec v20).
            if [ "$need_cef" -eq 1 ]; then
              if [ -L "$DEST_CEF" ]; then
                echo "🪄 Supprime symlink CEF dans $APP"
                rm -f "$DEST_CEF"
              fi
              if [ ! -d "$DEST_CEF" ]; then
                mkdir -p "$(dirname "$DEST_CEF")"
                if cp -cR "$SRC_CEF" "$DEST_CEF" 2>/dev/null; then
                  echo "📚 CEF clonefile → $DEST_CEF"
                else
                  echo "📚 CEF ditto fallback → $DEST_CEF"
                  /usr/bin/ditto "$SRC_CEF" "$DEST_CEF"
                fi
                # Guard: refuse accidental hardlinks (same inode as source binary)
                SRC_BIN=$(find "$SRC_CEF" -type f -name "Chromium Embedded Framework" -print -quit 2>/dev/null || true)
                DST_BIN=$(find "$DEST_CEF" -type f -name "Chromium Embedded Framework" -print -quit 2>/dev/null || true)
                if [ -n "$SRC_BIN" ] && [ -n "$DST_BIN" ]; then
                  SRC_INO=$(stat -f '%i' "$SRC_BIN" 2>/dev/null || true)
                  DST_INO=$(stat -f '%i' "$DST_BIN" 2>/dev/null || true)
                  if [ -n "$SRC_INO" ] && [ "$SRC_INO" = "$DST_INO" ]; then
                    echo "❌ CEF hardlink détecté (inode=$SRC_INO) — notary Invalid; abort"
                    exit 1
                  fi
                fi
                MUTATED=$((MUTATED + 1))
              fi
            fi

          done < <(find "$BUNDLE_ROOT" -type d -name "4D Helper*.app" -print0)

        done < <(find "$product_path" -type d -path "*/WebViewerCEF.bundle/Contents/Frameworks" -print0)

        if [ $FOUND -eq 0 ]; then
          echo "ℹ️ Aucun WebViewerCEF.bundle trouvé sous le produit (ce n’est pas bloquant)"
        else
          echo "ℹ️ CEF normalize: mutations=$MUTATED"
        fi

    - name: Preflight — aucun exécutable de helper ne doit être un symlink
      if: ${{ inputs.sign_product != 'false' }}
      shell: bash
      env:
        PRODUCT_PATH: ${{ inputs.product_path }}
      run: |
        set -euo pipefail
        product_path="${PRODUCT_PATH%/}"
        if [ ! -d "$product_path" ]; then
          echo "ℹ️ Skip helper symlink preflight (product n'est pas un dossier)"
          exit 0
        fi

        SYMLINKS_FOUND=0

        while IFS= read -r -d '' SYM; do
          if [ $SYMLINKS_FOUND -eq 0 ]; then
            echo "❌ Symlinks d'exécutables trouvés :"
          fi
          echo " - $SYM"
          SYMLINKS_FOUND=1
        done < <(find "$product_path" -type l -path "*/4D Helper*.app/Contents/MacOS/*" -print0)

        if [ $SYMLINKS_FOUND -eq 1 ]; then
          exit 1
        fi

        echo "✅ OK — aucun symlink executable dans les helpers du produit"

    - name: Codesign
      if: ${{ inputs.sign_product != 'false' }}
      shell: bash
      run: |
        set -euo pipefail

        # Keep GHA runner alive during long codesign (prevents lost communication).
        heartbeat() { while true; do echo "… codesign alive $(date -u +%H:%M:%S)"; sleep 60; done; }
        heartbeat &
        HB_PID=$!
        trap 'kill $HB_PID 2>/dev/null || true' EXIT

        # Workflows often pass product_path with a trailing slash (e.g. Foo.4dbase/).
        # Suffix checks (*.4dbase / *.app) and archive discovery require a clean path.
        product_path="${product_path%/}"
        sign_archives="${sign_archives:-true}"
        echo "ℹ️ sign_archives=${sign_archives}"

        # True when $1 lives under a nested *.4dbase / *.4darchive relative to product_path
        # (does NOT match top-level files when product_path itself is a .4dbase).
        is_under_nested_archive() {
          local abs="$1"
          local rel="${abs#"${product_path}/"}"
          [[ "$rel" == "$abs" ]] && return 1
          case "$rel" in
            *.4dbase/*|*.4darchive/*) return 0 ;;
            *) return 1 ;;
          esac
        }

        # Expected TeamIdentifier from workflow (Apple Developer Team ID).
        # Used for logging; skip accepts any Developer ID Application + timestamp so
        # pre-signed 4D/CEF binaries are not re-sent to Apple's TSA.
        EXPECTED_TEAM="${team_id:-}"
        echo "ℹ️ Codesign optimize: skip if Developer ID + timestamp (workflow team_id=${EXPECTED_TEAM:-unset})"

        # True when target already has Developer ID Application (+ secure timestamp unless
        # mode=devid). Modes:
        #   fast   — leaves on notarized .app: Authority + Timestamp (-dv only)
        #   strict — container seals / .app root: + codesign --verify --strict
        #   devid  — .4darchive only (never notarized): Authority alone; avoids TSA
        #            re-sign of DevID leaves that lack Timestamp (ATE v20 ZIP ~40 min)
        already_signed_ok() {
          local target="$1"
          local mode="${2:-fast}"
          local info
          [ -e "$target" ] || return 1
          # Fast path: -dv only. Do NOT require --verify --quiet first — it false-negatives
          # on freshly signed nested dylibs (ATE v20 SignApp/Server: codesign OK then
          # "Signature invalide après re-signature" on libxerces / lib4d-arm64).
          info=$(codesign -dv --verbose=2 "$target" 2>&1 || true)
          echo "$info" | grep -q "Authority=Developer ID Application" || return 1
          if [ "$mode" != "devid" ]; then
            echo "$info" | grep -q "Timestamp=" || return 1
          fi
          if [ "$mode" = "strict" ]; then
            codesign --verify --strict "$target" >/dev/null 2>&1 || return 1
          fi
          return 0
        }

        # codesign: never use --deep on leaf Mach-O files. --deep on Contents/MacOS/<app>
        # seals the whole bundle; later mutations (or hardlinked CEF copies) invalidate it.
        # After inside-out signing, seal containers WITHOUT --deep (do not re-walk the tree).
        refresh_keychain_access() {
          # Mitigate intermittent errSecInternalComponent on self-hosted Macs:
          # Security framework / keychain ACL can flake mid-job; re-unlock + partition list.
          if [ -z "${KEYCHAIN_PASSWORD:-}" ] || [ -z "${keychain:-}" ]; then
            echo "⚠️ KEYCHAIN_PASSWORD/keychain manquant — skip keychain refresh"
            return 0
          fi
          echo "🔄 Refresh keychain access: ${keychain}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain}" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${keychain}" >/dev/null 2>&1 || true
          security default-keychain -s "${keychain}" 2>/dev/null || true
          # Keep temp keychain first in search list (login.keychain can steal focus).
          EXISTING=$(security list-keychains -d user 2>/dev/null | sed -E 's/^[[:space:]]*"//;s/"[[:space:]]*$//' | tr '\n' ' ')
          # shellcheck disable=SC2086
          security list-keychains -d user -s "${keychain}" ${EXISTING} >/dev/null 2>&1 || true
          # Warm Securityd identity cache
          security find-identity -v -p codesigning "${keychain}" >/dev/null 2>&1 || true
        }

        retry_codesign() {
          local target="$1"
          local timestamp_flag="$2"
          local deep_flag="${3:-}"
          local attempt=1
          local max_attempts=5
          local delay=5
          local sub
          while [ $attempt -le $max_attempts ]; do
            echo "[$attempt/$max_attempts] codesign ${deep_flag:-} de: $target"
            # shellcheck disable=SC2086
            output=$(codesign --verbose --strict --options=runtime $deep_flag $timestamp_flag \
              --force --sign "${sign}" --keychain "${keychain}" \
              --entitlements "${entitlements_path}" "$target" 2>&1)
            status=$?
            echo "$output"
            if [ $status -eq 0 ]; then
              echo "✅ codesign réussi pour $target"
              return 0
            fi
            # Unsigned nested code is an ordering problem, not a hard identity failure.
            # Sign the reported subcomponent (e.g. Chromium Embedded Framework) then retry.
            if echo "$output" | grep -qi "In subcomponent:"; then
              sub=$(echo "$output" | sed -n 's/.*In subcomponent:[[:space:]]*//p' | head -1 | tr -d '\r')
              if [ -n "$sub" ] && [ -e "$sub" ] && [ "$sub" != "$target" ]; then
                echo "↪️ Unsigned subcomponent — sign first: $sub"
                # Recurse without deep; ignore failure so outer retry still runs
                retry_codesign "$sub" "$timestamp_flag" "" || true
                attempt=$(( attempt + 1 ))
                continue
              fi
            fi
            if echo "$output" | grep -qiE "no identity found|password|resource fork|invalid|not found in keychain"; then
              # errSecInternalComponent is transient — do not treat as fatal
              # "code object is not signed at all" alone is also NOT fatal when we can retry
              # after signing nested content (handled above via In subcomponent).
              if ! echo "$output" | grep -qiE "errSecInternalComponent|CSSMERR_CSP_DISABLED|code object is not signed at all"; then
                echo "❌ Erreur fatale détectée, arrêt immédiat."
                return 1
              fi
            fi
            if echo "$output" | grep -qiE "errSecInternalComponent|CSSMERR_CSP_DISABLED|CSSM_ERRCODE_OPERATION_AUTH_DENIED"; then
              refresh_keychain_access
            fi
            echo "⚠️ Tentative $attempt échouée, nouvelle tentative dans ${delay}s..."
            attempt=$(( attempt + 1 ))
            sleep $delay
            delay=$(( delay * 2 ))
          done
          echo "❌ Échec après $max_attempts tentatives pour $target"
          return 1
        }

        is_zip_file() {
          local p="$1"
          [ -f "$p" ] || return 1
          unzip -t "$p" >/dev/null 2>&1 && return 0
          file -b "$p" 2>/dev/null | grep -qiE 'Zip archive|ZIP' && return 0
          return 1
        }

        # Windows client archives must not be macOS-codesigned (PE binaries → fatal codesign errors)
        should_codesign_archive() {
          local p="$1"
          local base
          base="$(basename "$p")"
          if echo "$base" | grep -qiE '\.win\.4darchive$|^update\.win'; then
            echo "ℹ️ Skip Windows client archive (no macOS codesign): $p"
            return 1
          fi
          return 0
        }

        # Depth-sorted paths (deepest first). Portable for bash 3.2 / BSD sort (no -z).
        # find prints parents before children; codesign requires nested code signed first.
        # Do NOT skip *.4dbase/* — client ZIP archives embed Internal *Components/*.4dbase
        # with Libraries/lib4d-*.dylib that notarization/preflight require Developer ID on.
        deepest_first() {
          local root="$1"
          shift
          find -P "$root" "$@" -print | while IFS= read -r p; do
            printf '%05d\t%s\n' "$(echo "$p" | tr -cd '/' | wc -c | tr -d ' ')" "$p"
          done | sort -nr | cut -f2-
        }

        # Sign Mach-O leaves once per inode (CEF hardlinks), deepest path first, no --deep.
        # Then seal containers (.framework / .bundle / .app) deepest-first without --deep
        # (nested leaves already signed). Finally seal root bundle if it has Info.plist.
        # Optional $2 = leaf skip mode for already_signed_ok (default fast; use devid for
        # non-notarized .4darchive trees).
        sign_bundle_tree() {
          local bundle="$1"
          local leaf_skip_mode="${2:-fast}"
          echo "📂 Signing content inside: $bundle (leaf_skip=${leaf_skip_mode})"
          # bash 3.2 (macOS runners): no associative arrays — track inodes in a temp file
          local inode_log
          inode_log=$(mktemp /tmp/codesign-inodes.XXXXXX)

          sign_leaf_once() {
            local f="$1"
            local inode
            inode=$(stat -f '%i' "$f" 2>/dev/null || echo "")
            if [ -n "$inode" ] && grep -qx "$inode" "$inode_log" 2>/dev/null; then
              echo "⏭️  Skip hardlink (inode $inode already signed): $f"
              return 0
            fi
            if already_signed_ok "$f" "$leaf_skip_mode"; then
              if [ "$leaf_skip_mode" = "devid" ]; then
                echo "⏭️  Skip leaf (Developer ID, archive mode): $f"
              else
                echo "⏭️  Skip leaf (Developer ID + timestamp): $f"
              fi
              [ -n "$inode" ] && echo "$inode" >> "$inode_log"
              return 0
            fi
            echo "🔧 Signing leaf: $f"
            retry_codesign "$f" "--timestamp" "" || return 1
            [ -n "$inode" ] && echo "$inode" >> "$inode_log"
            return 0
          }

          # 1) Mach-O leaves, deepest first, unique inode.
          # Skip ONLY direct MacOS executables of THIS package (sealed at step 5).
          # Do NOT skip Contents/MacOS/*.app/** — InstallTool.app + LaunchServices
          # helpers (com.4D.Helper) live there and notarization requires them signed
          # (hardened runtime + timestamp). LaunchServices often lack +x.
          local leaf_find=(
            -type f \(
              -perm -111 -o -name "*.dylib" -o -name "*.so"
              -o -path "*/Library/LaunchServices/*"
              -o -path "*/XPCServices/*"
              -o -name "*.xpc"
            \)
          )
          if [ -f "$bundle/Contents/Info.plist" ] || [ -f "$bundle/Info.plist" ]; then
            leaf_find+=(
              ! \( -path "$bundle/Contents/MacOS/*"
                   ! -path "$bundle/Contents/MacOS/*.app"
                   ! -path "$bundle/Contents/MacOS/*.app/*" \)
              ! \( -path "$bundle/MacOS/*"
                   ! -path "$bundle/MacOS/*.app"
                   ! -path "$bundle/MacOS/*.app/*" \)
            )
          fi
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            # Never treat CEF resources / code-directory blobs as leaves (ATE v20:
            # fat CEF under helpers marks .pak/CodeResources +x; a broad
            # */4D Helper* bypass used to skip file(1) and send ~66 non-Mach-O
            # paths per helper to codesign --timestamp ~40s each).
            case "$f" in
              *.pak|*.dat|*.bin|*/Resources/*|*/_CodeSignature/*|*/CodeResources) continue ;;
            esac
            # Skip expensive file(1) only for known Mach-O paths — NOT every
            # path under 4D Helper*.app (that matched .pak / Resources too).
            case "$f" in
              *.dylib|*.so|*.bundle/Contents/MacOS/*|*/4D\ Helper*/Contents/MacOS/*|*/Chromium\ Embedded\ Framework|*/InstallTool|*/Updater) ;;
              */Library/LaunchServices/*|*/XPCServices/*|*.xpc) ;;
              *)
                if ! file -b "$f" 2>/dev/null | grep -qiE 'Mach-O|shared library|bundle|executable'; then
                  continue
                fi
                ;;
            esac
            sign_leaf_once "$f" || { rm -f "$inode_log"; return 1; }
          done < <(deepest_first "$bundle" "${leaf_find[@]}")

          # 1b) Explicit pass: any Mach-O under LaunchServices / XPCServices we might
          # have missed (odd permissions / names). Notarization rejects unsigned ones.
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              *.dylib|*.so) ;;
              *)
                file -b "$f" 2>/dev/null | grep -qiE 'Mach-O' || continue
                ;;
            esac
            sign_leaf_once "$f" || { rm -f "$inode_log"; return 1; }
          done < <(deepest_first "$bundle" -type f \( -path "*/Library/LaunchServices/*" -o -path "*/XPCServices/*" \))

          # Seal a container if not already valid. Notarized .app: strict (DevID+TS+verify).
          # Archive mode (devid): skip if DevID present — .4darchive is never notarized.
          seal_container() {
            local target="$1"
            local label="$2"
            local seal_mode=strict
            [ "$leaf_skip_mode" = "devid" ] && seal_mode=devid
            if already_signed_ok "$target" "$seal_mode"; then
              echo "⏭️  Skip $label (already sealed): $target"
              return 0
            fi
            echo "📘 Seal $label: $target"
            retry_codesign "$target" "--timestamp" "" || return 1
          }

          # 2) Seal frameworks deepest-first (no --deep: leaves already signed)
          while IFS= read -r fw; do
            [ -n "$fw" ] || continue
            seal_container "$fw" "framework" || { rm -f "$inode_log"; return 1; }
          done < <(deepest_first "$bundle" -type d -name "*.framework")

          # 3) Seal nested .app deepest-first BEFORE parent .bundle.
          # Normalize copies CEF into 4D Helper*.app inside WebViewerCEF.bundle; those
          # helpers must be re-sealed first. Sealing WebViewerCEF.bundle before helpers
          # (then skipping the bundle) left an invalid parent seal → notary Invalid on
          # WebViewerCEF.bundle/Contents/MacOS/WebViewerCEF (seen on AutoTestExec 21R4).
          while IFS= read -r app; do
            [ -n "$app" ] || continue
            # Skip sealing the root bundle here — done in step 5 / étape 3
            [ "$app" = "$bundle" ] && continue
            seal_container "$app" "nested .app" || { rm -f "$inode_log"; return 1; }
          done < <(deepest_first "$bundle" -type d -name "*.app")

          # 4) Opaque-sign non-Mach-O nested payloads before sealing a .4dbase/.bundle.
          # Apple treats unexpected files directly under Contents/ as nested code objects
          # ("code object is not signed at all / In subcomponent: …"). Seen on 4D main:
          #   - Contents/*.4DZ (Internal User Components)
          #   - Contents/README.md (Internal Components/runtime.4dbase)
          # No --options=runtime / entitlements — these are data files, not executables.
          #
          # Large .4DZ on self-hosted Macs often hit errSecInternalComponent on in-place
          # --force. Mitigations: strip xattrs, sign a /tmp copy, stronger keychain refresh,
          # more attempts with capped backoff.
          sign_opaque() {
            local target="$1"
            local out st attempt=1 max_attempts=8 delay=3
            local tmpdir tmpfile size_mb=0 use_inplace=0
            if already_signed_ok "$target" "$leaf_skip_mode"; then
              if [ "$leaf_skip_mode" = "devid" ]; then
                echo "⏭️  Skip opaque (Developer ID, archive mode): $target"
              else
                echo "⏭️  Skip opaque (Developer ID + timestamp): $target"
              fi
              return 0
            fi
            size_mb=$(du -sm "$target" 2>/dev/null | awk '{print $1}')
            # Small blobs: try in-place first (avoids /tmp copy). Large: /tmp copy only.
            if [ -n "$size_mb" ] && [ "$size_mb" -lt 50 ]; then
              use_inplace=1
            fi
            refresh_keychain_access
            while [ $attempt -le $max_attempts ]; do
              echo "📄 Sign opaque [$attempt/$max_attempts]: $target (${size_mb:-?}MB inplace=$use_inplace)"
              if [ "$use_inplace" -eq 1 ] && [ "$attempt" -eq 1 ]; then
                xattr -cr "$target" 2>/dev/null || true
                out=$(codesign --force --sign "${sign}" --keychain "${keychain}" --timestamp "$target" 2>&1)
                st=$?
                echo "$out"
                if [ "$st" -eq 0 ]; then
                  echo "✅ Opaque signé (in-place): $target"
                  return 0
                fi
                echo "⚠️ In-place opaque failed — fallback /tmp copy"
                use_inplace=0
              fi
              tmpdir=$(mktemp -d /tmp/opaque-sign.XXXXXX)
              tmpfile="$tmpdir/$(basename "$target")"
              if ! cp -f "$target" "$tmpfile"; then
                rm -rf "$tmpdir"
                echo "❌ Opaque: copie temporaire impossible: $target"
                return 1
              fi
              xattr -cr "$tmpfile" 2>/dev/null || true
              out=$(codesign --force --sign "${sign}" --keychain "${keychain}" --timestamp "$tmpfile" 2>&1)
              st=$?
              echo "$out"
              if [ "$st" -eq 0 ]; then
                if ! mv -f "$tmpfile" "$target"; then
                  rm -rf "$tmpdir"
                  echo "❌ Opaque: remplacement impossible: $target"
                  return 1
                fi
                rm -rf "$tmpdir"
                echo "✅ Opaque signé: $target"
                return 0
              fi
              rm -rf "$tmpdir"
              if echo "$out" | grep -qiE "errSecInternalComponent|CSSMERR_CSP_DISABLED|CSSM_ERRCODE_OPERATION_AUTH_DENIED"; then
                refresh_keychain_access
              elif echo "$out" | grep -qiE "no identity found|not found in keychain"; then
                echo "❌ Échec signature opaque (fatal): $target"
                return 1
              fi
              echo "⚠️ Opaque sign tentative $attempt échouée, retry dans ${delay}s..."
              attempt=$(( attempt + 1 ))
              sleep $delay
              delay=$(( delay * 2 ))
              if [ "$delay" -gt 30 ]; then delay=30; fi
            done
            echo "❌ Échec signature opaque: $target"
            return 1
          }

          local opaque_f base
          while IFS= read -r opaque_f; do
            [ -n "$opaque_f" ] || continue
            sign_opaque "$opaque_f" || { rm -f "$inode_log"; return 1; }
          done < <(deepest_first "$bundle" -type f \( -name "*.4DZ" -o -name "*.4dz" \))

          if [ -d "$bundle/Contents" ]; then
            while IFS= read -r opaque_f; do
              [ -n "$opaque_f" ] || continue
              base="$(basename "$opaque_f")"
              case "$base" in
                Info.plist|PkgInfo|CodeResources) continue ;;
              esac
              # Skip if already signed above as .4DZ (re-sign is harmless but noisy)
              case "$opaque_f" in
                *.4DZ|*.4dz) continue ;;
              esac
              sign_opaque "$opaque_f" || { rm -f "$inode_log"; return 1; }
            done < <(find -P "$bundle/Contents" -maxdepth 1 -type f -print)
          fi

          # 4c) Seal nested *.4dbase with Contents/Info.plist (4D 20R8+ component layout).
          # Étape 2 used to re-run sign_bundle_tree on each of these; after this seal,
          # directory packages only need preflight.
          while IFS= read -r db; do
            [ -n "$db" ] || continue
            [ "$db" = "$bundle" ] && continue
            [ -f "$db/Contents/Info.plist" ] || continue
            seal_container "$db" "nested .4dbase" || { rm -f "$inode_log"; return 1; }
          done < <(deepest_first "$bundle" -type d -name "*.4dbase")

          # 4d) Seal bundles / plugins / kext LAST among nested containers so parent
          # WebViewerCEF.bundle is re-sealed after helper .app seals (verify fails → no skip).
          while IFS= read -r bp; do
            [ -n "$bp" ] || continue
            seal_container "$bp" "bundle/plugin/kext" || { rm -f "$inode_log"; return 1; }
          done < <(deepest_first "$bundle" -type d \( -name "*.bundle" -o -name "*.plugin" -o -name "*.kext" \))

          # 5) Sign root MacOS binaries then seal package
          # Support both layouts:
          #   - app root with Contents/Info.plist
          #   - Contents/ itself as sign_root (Info.plist at $bundle/Info.plist) — must NOT happen
          #     if resolve_sign_root is correct, but seal either way.
          local seal_target=""
          if [ -f "$bundle/Contents/Info.plist" ]; then
            seal_target="$bundle"
            if [ -d "$bundle/Contents/MacOS" ]; then
              while IFS= read -r mainbin; do
                [ -n "$mainbin" ] || continue
                sign_leaf_once "$mainbin" || { rm -f "$inode_log"; return 1; }
              done < <(find -P "$bundle/Contents/MacOS" -maxdepth 1 -type f -print)
            fi
          elif [ -f "$bundle/Info.plist" ] && [ -d "$bundle/MacOS" ]; then
            # sign_root incorrectly set to Contents/ — seal parent if possible
            seal_target="$(dirname "$bundle")"
            while IFS= read -r mainbin; do
              [ -n "$mainbin" ] || continue
              sign_leaf_once "$mainbin" || { rm -f "$inode_log"; return 1; }
            done < <(find -P "$bundle/MacOS" -maxdepth 1 -type f -print)
          fi

          rm -f "$inode_log"

          if [ -n "$seal_target" ] && [ -f "$seal_target/Contents/Info.plist" ]; then
            seal_container "$seal_target" "package root" || return 1
            if ! codesign --verify --verbose --strict "$seal_target" 2>&1; then
              # Slim .4darchive keeps helper CEF as external symlinks — Apple --verify
              # --strict then reports "plist or signature have been modified" even with a
              # valid DevID root seal. Archives are never notarized; do not fail the job.
              if [ "$leaf_skip_mode" = "devid" ]; then
                echo "⚠️ codesign --verify --strict soft-fail on archive root (slim CEF symlinks OK): $seal_target"
                if already_signed_ok "$seal_target" devid; then
                  echo "✅ Archive root still Developer ID — accept without strict verify"
                else
                  echo "❌ Archive root missing Developer ID after seal: $seal_target"
                  return 1
                fi
              else
                echo "❌ codesign --verify échoué après signature finale: $seal_target"
                return 1
              fi
            fi
          elif [ -f "$bundle/Info.plist" ]; then
            # Last resort: codesign the Contents directory's parent isn't available; sign main binaries only
            echo "⚠️ Layout Contents/ sans parent scellable — pas de signature de bundle racine"
          fi
        }

        # Resolve extract layout for client .4darchive (ZIP root is usually Contents/)
        resolve_sign_root() {
          local extract_root="$1"
          local sign_root="$extract_root"
          local top_count only base
          top_count=$(find "$extract_root" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')
          if [ "$top_count" = "1" ]; then
            only=$(find "$extract_root" -mindepth 1 -maxdepth 1 -print -quit)
            if [ -d "$only" ]; then
              base="$(basename "$only")"
              # Lone top-level Contents/ → keep parent as app-like root
              if [ "$base" = "Contents" ]; then
                sign_root="$extract_root"
              else
                sign_root="$only"
              fi
            fi
          fi
          printf '%s' "$sign_root"
        }

        # For ZIP .4darchive: keep slim size (no CEF ditto copies).
        # Build-time archives often have broken CEF symlinks inside 4D Helper*.app
        # ("invalid destination for symbolic link"). Retarget them to the shared CEF
        # next to the helpers: ../../../Chromium Embedded Framework.framework
        # Also materialize helper *executable* symlinks (Apple rejects those).
        normalize_helpers_slim_under() {
          local root="$1"
          local py_resolve='import os,sys; base=sys.argv[1]; tgt=sys.argv[2]; print(os.path.abspath(os.path.join(base, tgt)))'
          local cef_rel="../../../Chromium Embedded Framework.framework"
          local exec_fixed=0
          local cef_fixed=0

          while IFS= read -r -d '' BUNDLE_FW; do
            local SRC_CEF="${BUNDLE_FW}/Chromium Embedded Framework.framework"
            if [ ! -d "$SRC_CEF" ] && [ ! -L "$SRC_CEF" ]; then
              echo "⚠️ CEF partagé introuvable dans $BUNDLE_FW — skip helpers ici"
              continue
            fi
            echo "📦 Slim-normalize helpers under: $BUNDLE_FW"

            while IFS= read -r -d '' APP; do
              local NAME EXE TGT RESOLVED DEST_CEF
              NAME="$(basename "$APP" .app)"
              EXE="$APP/Contents/MacOS/$NAME"
              if [ -L "$EXE" ]; then
                TGT="$(readlink "$EXE")"
                RESOLVED=$(python3 -c "$py_resolve" "$(dirname "$EXE")" "$TGT")
                if [ -f "$RESOLVED" ]; then
                  echo "🪄 Materialize helper exec: $EXE"
                  rm -f "$EXE"
                  /usr/bin/ditto "$RESOLVED" "$EXE"
                  chmod 755 "$EXE"
                  exec_fixed=$((exec_fixed + 1))
                else
                  echo "⚠️ Helper exec symlink broken: $EXE -> $TGT"
                fi
              fi

              DEST_CEF="$APP/Contents/Frameworks/Chromium Embedded Framework.framework"
              mkdir -p "$APP/Contents/Frameworks"
              # Always prefer a valid relative symlink (never a full copy)
              if [ -L "$DEST_CEF" ] || [ -e "$DEST_CEF" ]; then
                # Resolve current target; rewrite if missing/invalid
                if [ -L "$DEST_CEF" ]; then
                  if [ ! -e "$DEST_CEF" ]; then
                    echo "🪄 CEF symlink cassé → $cef_rel dans $APP"
                    rm -f "$DEST_CEF"
                    ln -s "$cef_rel" "$DEST_CEF"
                    cef_fixed=$((cef_fixed + 1))
                  elif [ "$(readlink "$DEST_CEF")" != "$cef_rel" ]; then
                    # Exists but non-canonical — keep if resolvable, else rewrite
                    if [ ! -d "$DEST_CEF" ]; then
                      echo "🪄 CEF symlink retarget → $cef_rel dans $APP"
                      rm -f "$DEST_CEF"
                      ln -s "$cef_rel" "$DEST_CEF"
                      cef_fixed=$((cef_fixed + 1))
                    fi
                  fi
                elif [ -d "$DEST_CEF" ]; then
                  # Real directory copy (fat) — replace with symlink to stay slim
                  echo "🪄 CEF copy → symlink $cef_rel dans $APP (slim)"
                  rm -rf "$DEST_CEF"
                  ln -s "$cef_rel" "$DEST_CEF"
                  cef_fixed=$((cef_fixed + 1))
                fi
              else
                echo "🪄 CEF absent → symlink $cef_rel dans $APP"
                ln -s "$cef_rel" "$DEST_CEF"
                cef_fixed=$((cef_fixed + 1))
              fi

              # Confirm relative link resolves
              if [ ! -d "$DEST_CEF" ]; then
                echo "❌ CEF symlink toujours invalide dans $APP (cible $cef_rel)"
                ls -la "$APP/Contents/Frameworks" || true
                return 1
              fi
            done < <(find "$BUNDLE_FW" -type d -name "4D Helper*.app" -print0)
          done < <(find "$root" -type d -path "*/WebViewerCEF.bundle/Contents/Frameworks" -print0)

          echo "ℹ️ Slim helpers: exec_fixed=$exec_fixed cef_symlinks_fixed=$cef_fixed"
          return 0
        }

        # Strict validity for skip/recompress gate: root (or main binary) only.
        # 4D Helper*.app keep CEF as a symlink to the shared framework OUTSIDE the
        # helper .app (slim archive). codesign --verify --strict then reports
        # "invalid destination for symbolic link in bundle" — expected, and Apple
        # notarization of Server accepted that layout historically (e.g. 12.0.1).
        # Helper Mach-Os are still signed; preflight checks Developer ID + timestamp.
        archive_tree_verifies() {
          local sign_root="$1"
          local main=""

          if [ -f "$sign_root/Contents/Info.plist" ]; then
            if codesign --verify --strict "$sign_root" >/dev/null 2>&1; then
              return 0
            fi
            main=$(find -P "$sign_root/Contents/MacOS" -maxdepth 1 -type f -print -quit 2>/dev/null)
            if [ -n "$main" ] && codesign --verify --strict "$main" >/dev/null 2>&1; then
              return 0
            fi
            return 1
          fi
          if [ -f "$sign_root/Info.plist" ] && [ -d "$sign_root/MacOS" ]; then
            main=$(find -P "$sign_root/MacOS" -maxdepth 1 -type f -print -quit 2>/dev/null)
            if [ -n "$main" ] && codesign --verify --strict "$main" >/dev/null 2>&1; then
              return 0
            fi
          fi
          return 1
        }

        # Expand ZIP .4darchive → sign only if needed → recompress (zip -ryX, no AppleDouble)
        # Keeps slim layout (CEF relative symlinks outside helper .apps). Client.app CEF copies stay on .app path only.
        prepare_and_sign_zip_4darchive() {
          local archive="$1"
          local work extract_root out_tmp sign_root
          echo "📦 prepare_4darchive: ZIP detecté → extract / sign / recompress: $archive"
          work=$(mktemp -d /tmp/4darchive-sign.XXXXXX)
          extract_root="$work/root"
          mkdir -p "$extract_root"
          if ! ditto -x -k "$archive" "$extract_root" 2>/dev/null; then
            echo "⚠️ ditto -x -k a échoué, fallback unzip"
            unzip -qo "$archive" -d "$extract_root"
          fi

          sign_root="$(resolve_sign_root "$extract_root")"
          echo "📂 sign_root=$sign_root"

          if archive_tree_verifies "$sign_root"; then
            echo "✅ Archive root déjà valide — pas de re-signature ni recompress"
            rm -rf "$work"
            return 0
          fi
          # Note: do NOT run a full verify_macho "early-exit" here when root verify
          # fails — on unsigned Upgrade4DClient ZIPs (common when the archive lives
          # only next to Client.app, not under Contents/Upgrade4DClient/) that scan
          # costs time and still falls through to a full resign (seen on ATE 20:
          # 97 failures then ~30 min sign). Rely on archive_tree_verifies + sync from
          # a nested signed copy when the build embeds one.
          echo "ℹ️ Archive root non valide — fix helper exec + CEF symlinks relatifs + sign + recompress (sans copies CEF)"

          normalize_helpers_slim_under "$sign_root" || { rm -rf "$work"; return 1; }
          # devid: archive is never notarized — skip DevID leaves lacking Timestamp
          sign_bundle_tree "$sign_root" devid || { rm -rf "$work"; return 1; }

          if ! archive_tree_verifies "$sign_root"; then
            echo "❌ Signature root invalide AVANT recompress ZIP: $sign_root"
            codesign --verify --verbose --strict "$sign_root" 2>&1 || true
            rm -rf "$work"
            return 1
          fi
          echo "✅ Verify OK before ZIP recompress (root; helpers may warn on external CEF symlinks)"

          out_tmp="${archive}.signed.tmp.zip"
          rm -f "$out_tmp"
          echo "📦 Recompress ZIP (zip -ryX) from $extract_root"
          (cd "$extract_root" && zip -r -y -X -q "$out_tmp" .) || {
            echo "❌ zip recompress failed"
            rm -rf "$work"
            return 1
          }
          mv -f "$out_tmp" "$archive"
          xattr -cr "$archive" 2>/dev/null || true
          rm -rf "$work"
          echo "✅ prepare_4darchive: recompress OK → $archive"
        }

        verify_macho_signatures_under() {
          local root="$1"
          local label="$2"
          local failures=0
          local checked=0
          echo "=== Preflight signatures ($label): $root ==="
          while IFS= read -r -d '' bin; do
            # Limit to Mach-O / likely signed payloads
            if ! file -b "$bin" 2>/dev/null | grep -qiE 'Mach-O|shared library|bundle|executable'; then
              continue
            fi
            checked=$((checked + 1))
            local sig_info
            sig_info=$(codesign -dv --verbose=4 "$bin" 2>&1 || true)
            if ! echo "$sig_info" | grep -q "Authority=Developer ID Application"; then
              echo "❌ Preflight: Developer ID absent: $bin"
              failures=$((failures + 1))
              continue
            fi
            if ! echo "$sig_info" | grep -q "Timestamp="; then
              echo "❌ Preflight: Timestamp absent: $bin"
              failures=$((failures + 1))
              continue
            fi
            # codesign -dv can still look "signed" when the hash no longer matches.
            # Exception: 4D Helper*.app with CEF symlink to the shared framework outside
            # the helper bundle — --strict reports "invalid destination for symbolic link"
            # while the Mach-O itself is Developer ID + timestamped (slim archive layout).
            if ! codesign --verify --strict "$bin" >/dev/null 2>&1; then
              verify_err=$(codesign --verify --verbose=4 --strict "$bin" 2>&1 || true)
              if echo "$bin" | grep -q '4D Helper' \
                && echo "$verify_err" | grep -qi 'invalid destination for symbolic link'; then
                echo "ℹ️ Preflight: helper CEF external symlink (accepted for slim archive): $bin"
              else
                echo "❌ Preflight: codesign --verify failed: $bin"
                echo "$verify_err"
                failures=$((failures + 1))
                continue
              fi
            fi
          done < <(find -L "$root" -type f \( -perm -111 -o -name "*.dylib" -o -name "*.so" \) -print0)

          echo "Preflight $label: checked=$checked failures=$failures"
          if [ "$failures" -gt 0 ]; then
            echo "❌ Preflight échoué pour $label ($failures binaire(s))"
            return 1
          fi
          if [ "$checked" -eq 0 ]; then
            echo "⚠️ Preflight: aucun Mach-O trouvé sous $root (peut être normal pour un 4dbase sans lib native)"
          fi
          return 0
        }

        preflight_archive_path() {
          local archive="$1"
          if [ -d "$archive" ]; then
            verify_macho_signatures_under "$archive" "dir:$archive" || return 1
          elif is_zip_file "$archive"; then
            local work
            work=$(mktemp -d /tmp/4darchive-preflight.XXXXXX)
            if ! ditto -x -k "$archive" "$work" 2>/dev/null; then
              unzip -qo "$archive" -d "$work"
            fi
            verify_macho_signatures_under "$work" "zip:$archive" || { rm -rf "$work"; return 1; }
            rm -rf "$work"
          else
            echo "⚠️ Preflight: type non géré pour $archive"
          fi
        }

        # === Étape 1 : inside-out sign of .app / directory products ===
        # Skip when product_path is itself a ZIP file (Archive Client path).
        # Do NOT use a raw find loop: find lists parents before children, so we used to
        # codesign 4D Helper MacOS while Chromium Embedded Framework was still unsigned
        # (Normalize copies CEF into helpers), then abort on "code object is not signed".
        # sign_bundle_tree already does leaves → frameworks → bundles → apps deepest-first.
        if [ -d "${product_path}" ]; then
          case "${product_path}" in
            *.4darchive)
              # Directory update archive: keep relative CEF symlinks (no fat copies).
              echo "=== Slim-normalize directory .4darchive before sign_bundle_tree ==="
              normalize_helpers_slim_under "${product_path}" || exit 1
              # BuildApp often leaves a valid root seal + 4D DevID leaves — full tree
              # walk (codesign -dv × thousands) was 40+ min on ATE v20 SignArchive.
              # Prefer archive_tree_verifies; else accept DevID root (strict verify often
              # fails on slim helper CEF symlinks — ATE v21 SignArchive).
              if archive_tree_verifies "${product_path}"; then
                echo "✅ Directory .4darchive root already valid after slim — skip sign_bundle_tree"
              elif already_signed_ok "${product_path}" devid; then
                echo "✅ Directory .4darchive root Developer ID after slim — skip sign_bundle_tree (strict verify soft)"
              else
                echo "=== Signing directory .4darchive (sign_bundle_tree, devid) ==="
                sign_bundle_tree "${product_path}" devid || exit 1
              fi
              ;;
            *)
              echo "=== Signing all main components (sign_bundle_tree) ==="
              sign_bundle_tree "${product_path}" || exit 1
              ;;
          esac
        else
          echo "=== Skipping étape 1 (product_path is not a directory): ${product_path} ==="
        fi

        # === Étape 2 : ZIP archives only (extract / sign / recompress) ===
        # Directory *.4dbase / *.4darchive are already covered by étape 1
        # (leaves + opaque + nested .4dbase seal). Re-running sign_bundle_tree
        # on each of them used to cost ~6–30 min of duplicate TSA round-trips.
        echo "=== Signing ZIP .4dbase / .4darchive (directories → preflight only) ==="
        TREATED_ARCHIVES=()
        JUST_SIGNED_ARCHIVES=()

        if [ "${sign_archives}" = "false" ]; then
          echo "⏭️ sign_archives=false — skip étape 2 archive discovery (SignApp path)"
        else
        collect_archives() {
          # product_path itself is a directory package
          if [[ -d "${product_path}" && ( "${product_path}" == *.4dbase || "${product_path}" == *.4darchive ) ]]; then
            printf '%s\0' "${product_path}"
          fi
          # product_path itself is a ZIP .4darchive / .4dbase
          if [[ -f "${product_path}" && ( "${product_path}" == *.4dbase || "${product_path}" == *.4darchive ) ]]; then
            printf '%s\0' "${product_path}"
          fi
          if [ -d "${product_path}" ]; then
            # Nested directory packages (preflight only — signed in étape 1)
            find -L "${product_path}" -mindepth 1 -type d \( -name "*.4dbase" -o -name "*.4darchive" \) -print0
            # Nested ZIP archives (e.g. Upgrade4DClient/update.mac.4darchive)
            find -L "${product_path}" -mindepth 1 -type f \( -name "*.4darchive" -o -name "*.4dbase" \) -print0
          fi
          # Sibling update.mac.4darchive next to Client.app (common when BuildApp does not
          # embed under Contents/Upgrade4DClient). Sign here so Archive step can skip.
          if [[ "${product_path}" == *.app ]]; then
            sibling="$(dirname "${product_path}")/update.mac.4darchive"
            if [ -e "$sibling" ]; then
              printf '%s\0' "$sibling"
            fi
          fi
        }

        while IFS= read -r -d '' bundle; do
          if ! should_codesign_archive "$bundle"; then
            continue
          fi
          if [ -d "$bundle" ]; then
            echo "ℹ️ Directory package — skip re-sign (étape 1), preflight only: $bundle"
            TREATED_ARCHIVES+=("$bundle")
          elif is_zip_file "$bundle"; then
            prepare_and_sign_zip_4darchive "$bundle" || exit 1
            TREATED_ARCHIVES+=("$bundle")
            JUST_SIGNED_ARCHIVES+=("$bundle")
          else
            echo "⚠️ Ignoré (ni dossier ni ZIP): $bundle"
          fi
        done < <(collect_archives)

        # === Preflight: fail fast before DMG/notary if nested archives still unsigned ===
        echo "=== Preflight nested archives after signing ==="
        if [ "${#TREATED_ARCHIVES[@]}" -gt 0 ]; then
          for arch in "${TREATED_ARCHIVES[@]}"; do
            # Full verify when we just signed in-process is redundant — sample only.
            just=0
            for j in "${JUST_SIGNED_ARCHIVES[@]+"${JUST_SIGNED_ARCHIVES[@]}"}"; do
              [ "$j" = "$arch" ] && just=1 && break
            done
            if [ "$just" -eq 1 ] && [ -f "$arch" ]; then
              echo "ℹ️ Preflight sample (just signed ZIP): $arch"
              if ! unzip -t "$arch" >/dev/null 2>&1; then
                echo "❌ ZIP invalide juste après signature: $arch"
                exit 1
              fi
              continue
            fi
            preflight_archive_path "$arch" || exit 1
          done
        else
          echo "ℹ️ Aucune archive .4dbase/.4darchive traitée"
        fi
        # Extra: any Upgrade4DClient archives under a .app that might have been missed
        if [[ "${product_path}" == *.app ]]; then
          UPGRADE_DIR="${product_path}/Contents/Upgrade4DClient"
          if [ -d "$UPGRADE_DIR" ]; then
            while IFS= read -r -d '' arch; do
              if ! should_codesign_archive "$arch"; then
                continue
              fi
              # Skip if already in TREATED_ARCHIVES
              already=0
              for t in "${TREATED_ARCHIVES[@]+"${TREATED_ARCHIVES[@]}"}"; do
                [ "$t" = "$arch" ] && already=1 && break
              done
              if [ "$already" -eq 0 ]; then
                echo "⚠️ Archive Upgrade4DClient non traitée en étape 2, preflight seul: $arch"
                preflight_archive_path "$arch" || exit 1
              fi
            done < <(find "$UPGRADE_DIR" \( -type d -o -type f \) -name '*.4darchive' -print0)
          fi
        fi
        fi # sign_archives != false

        # === Étape 2.5 : sanity pass dylibs (verify léger, re-sign seulement si manquant) ===
        # Nested *.4dbase/* already covered by preflight — skip them here.
        # Top-level Libraries/*.dylib when product_path IS a .4dbase must still be checked.
        if [ -d "${product_path}" ]; then
          echo "=== Dylib signature sanity pass ==="
          while IFS= read -r -d '' dylib; do
            if is_under_nested_archive "$dylib"; then
              continue
            fi
            if already_signed_ok "$dylib"; then
              continue
            fi
            echo "⚠️ Re-signature requise: $dylib"
            retry_codesign "$dylib" "--timestamp" "" || exit 1
            # Brief pause: Apple TSA metadata can lag behind a successful codesign exit.
            if ! already_signed_ok "$dylib"; then
              sleep 2
            fi
            if ! already_signed_ok "$dylib"; then
              echo "❌ Signature invalide (Developer ID / timestamp) après re-signature: $dylib"
              codesign -dv --verbose=2 "$dylib" 2>&1 || true
              exit 1
            fi
          done < <(find "${product_path}" -type f -name "*.dylib" -print0)

          # === Étape 2.6 : sanity pass binaires principaux de frameworks ===
          echo "=== Framework main binary signature sanity pass ==="
          while IFS= read -r -d '' fw; do
            if is_under_nested_archive "$fw"; then
              continue
            fi
            fwname="$(basename "$fw" .framework)"
            main_bin=""

            candidates=("$fw/Versions/A/$fwname" "$fw/Versions/Current/$fwname" "$fw/$fwname")
            for c in "${candidates[@]}"; do
              if [ -f "$c" ]; then
                main_bin="$c"
                break
              fi
            done

            if [[ -z "$main_bin" ]]; then
              main_bin=$(find -L "$fw" -maxdepth 5 -type f -name "$fwname" -print -quit || true)
            fi

            if [[ -z "$main_bin" ]]; then
              echo "⚠️ Impossible d'identifier le binaire principal pour $fw"
              continue
            fi

            if already_signed_ok "$main_bin"; then
              continue
            fi
            echo "⚠️ Re-signature framework main binary requise: $main_bin"
            retry_codesign "$main_bin" "--timestamp" "" || exit 1
            if ! already_signed_ok "$main_bin"; then
              echo "❌ Signature framework invalide après re-signature: $main_bin"
              exit 1
            fi
          done < <(find -L "${product_path}" -type d -name "*.framework" -print0)
        else
          echo "=== Skipping dylib/framework sanity passes (product_path is not a directory) ==="
        fi

        # === Étape 3 : seal racine SANS --deep (inside-out déjà fait) ===
        # --deep retraverse tout l'arbre et re-envoie chaque nested code au TSA.
        if [[ "${product_path}" == *.app ]]; then
          echo "📦 Signature finale de l’app principale (no --deep): ${product_path}"
          if already_signed_ok "${product_path}" strict; then
            echo "⏭️  Root app déjà scellée — skip"
          else
            retry_codesign "${product_path}" "--timestamp" "" || exit 1
          fi
        elif [[ -d "${product_path}" && ( "${product_path}" == *.4dbase || "${product_path}" == *.4darchive ) ]]; then
          # Depuis 4D 20R8, un composant utilisant la structure "Contents/Info.plist" doit être
          # signé en tant que bundle racine, faute de quoi macOS ne génère jamais
          # Contents/_CodeSignature ("code object is not signed at all"). Les structures historiques
          # (plates, sans Contents/Info.plist) ne sont pas concernées et restent inchangées.
          if [ -f "${product_path}/Contents/Info.plist" ]; then
            echo "📦 Structure Contents/Info.plist détectée — seal racine (no --deep): ${product_path}"
            # .4darchive: never notarized — DevID alone is enough (strict verify fails on slim CEF).
            root_mode=strict
            case "${product_path}" in *.4darchive) root_mode=devid ;; esac
            if already_signed_ok "${product_path}" "$root_mode"; then
              echo "⏭️  Root package déjà scellé ($root_mode) — skip"
            else
              retry_codesign "${product_path}" "--timestamp" "" || exit 1
            fi
          else
            echo "ℹ️ ${product_path} : structure historique (plate, sans Contents/Info.plist) — pas de signature de bundle racine."
          fi
        elif [[ -f "${product_path}" && ( "${product_path}" == *.4dbase || "${product_path}" == *.4darchive ) ]]; then
          echo "ℹ️ ${product_path} : archive ZIP — signature racine non applicable (contenu déjà signé + recompressé)."
        else
          echo "ℹ️ ${product_path} n’est pas un .app/.4dbase/.4darchive scellable, pas de signature racine."
        fi

      env:
        sign: ${{ inputs.sign }}
        keychain: ${{ inputs.keychain }}
        product_path: ${{ inputs.product_path }}
        team_id: ${{ inputs.team_id }}
        entitlements_path: ${{ steps.setup.outputs.entitlements_path }}
        sign_archives: ${{ inputs.sign_archives }}

    - name: hdiutil (sparse -> convert)
      id: hdiutil
      if: ${{ inputs.create_dmg != 'false' && inputs.dmg_exists != 'true' && !contains(inputs.product_path, 'update.mac.4darchive') }}
      shell: bash
      env:
        product_path: ${{ inputs.product_path }}
        dmg_path: ${{ steps.setup.outputs.dmg_path }}
        FS: HFS+                 # ou APFS si tu préfères
        FORMAT: UDZO             # zlib — much faster than UDBZ for multi‑GB apps
        MARGIN_PCT: "50"         # marge % au-dessus de la taille source
        EXTRA_MB: "500"          # marge fixe supplémentaire en MB
        VERIFY: "0"              # convert already fails on corrupt images
      run: |
        set -euo pipefail

        SRC="${product_path}"
        OUT="${dmg_path}"
        VOLNAME="$(basename "${OUT%.dmg}")"
        WORKDIR="$(mktemp -d /tmp/dmgbuild.XXXXXX)"
        MOUNT_DIR="${WORKDIR}/mnt"
        mkdir -p "$MOUNT_DIR"

        SRC_KB=$(du -sk "$SRC" | awk '{print $1}')
        SRC_MB=$(( SRC_KB / 1024 ))
        if [[ $SRC_MB -lt 1 ]]; then SRC_MB=1; fi
        NEEDED_MB=$(( SRC_MB + (SRC_MB * ${MARGIN_PCT} / 100) + ${EXTRA_MB} ))
        if [[ $NEEDED_MB -lt 300 ]]; then NEEDED_MB=300; fi
        echo "ℹ️ DMG size estimate: src=${SRC_MB}MB → sparse=${NEEDED_MB}MB"

        # Sparse + montage
        hdiutil create -type SPARSE -fs "${FS}" -volname "${VOLNAME}" -nospotlight \
          -size "${NEEDED_MB}m" -ov "${WORKDIR}/staging.sparseimage"

        hdiutil attach "${WORKDIR}/staging.sparseimage" -nobrowse -noverify -noautoopen -owners on \
          -mountpoint "${MOUNT_DIR}"

        rsync -a --delete "${SRC}" "${MOUNT_DIR}/"

        # Démontage
        sync
        hdiutil detach "${MOUNT_DIR}" || hdiutil detach -force "${MOUNT_DIR}" || true

        # Compact + conversion
        hdiutil compact "${WORKDIR}/staging.sparseimage" || true
        hdiutil convert "${WORKDIR}/staging.sparseimage" -format "${FORMAT}" -o "${OUT}" -ov

        # Verify optionnel
        if [[ "${VERIFY}" == "1" ]]; then
          hdiutil verify "${OUT}"
        fi

        echo "[✓] DMG prêt: ${OUT}"

    - name: Skip notarization (sign-only mode)
      id: notarytool-skip
      if: ${{ inputs.notarize == 'false' || contains(inputs.product_path, 'update.mac.4darchive') }}
      shell: bash
      run: |
        set -euo pipefail
        status_file="${GITHUB_WORKSPACE}/notarization_status.txt"
        echo "Skipped" > "$status_file"
        echo "notarization_status=Skipped" >> "$GITHUB_OUTPUT"
        echo "ℹ️ Notarization skipped (notarize=false or archive product)"

    - name: Debug notarization env vars
      id: debug-notarization
      if: ${{ inputs.notarize != 'false' && !contains(inputs.product_path, 'update.mac.4darchive') }}
      run: |
        echo "Apple ID: ${apple_id}"
        echo "Team ID: ${team_id}"
        echo "Password is set: [${#password} characters]"
      shell: bash
      env:
        apple_id: ${{ inputs.apple_id }}
        team_id: ${{ inputs.team_id }}
        password: ${{ inputs.password }}

    - name: Notarize with Apple NotaryTool (--wait) and staple
      id: notarytool-wait
      if: ${{ inputs.notarize != 'false' && !contains(inputs.product_path, 'update.mac.4darchive') }}
      shell: bash
      run: |
        set -euo pipefail

        status_file="${GITHUB_WORKSPACE}/notarization_status.txt"
        log() { echo "$@" >&2; }

        log "📦 notarytool submit --wait (timeout 30m)..."
        json_file="notarytool-submit-wait.json"
        set +e
        xcrun notarytool submit "$dmg_path" \
          --apple-id "$apple_id" \
          --team-id "$team_id" \
          --password "$password" \
          --wait \
          --timeout 30m \
          --output-format json >"$json_file" 2>notarytool-submit-wait.stderr.log
        submit_rc=$?
        set -e

        if [[ -s notarytool-submit-wait.stderr.log ]]; then
          log "📄 stderr:"
          head -40 notarytool-submit-wait.stderr.log >&2 || true
        fi
        if [[ -s "$json_file" ]]; then
          log "📄 JSON:"
          head -40 "$json_file" >&2 || true
        fi

        submission_id=$(jq -r '.id // empty' "$json_file" 2>/dev/null || true)
        status=$(jq -r '.status // empty' "$json_file" 2>/dev/null || true)

        # --wait sometimes prints progress on stderr and final JSON on stdout;
        # if status empty, fall back to notarytool info.
        if [[ -n "$submission_id" && -z "$status" ]]; then
          info_file="notarytool-info-final.json"
          xcrun notarytool info "$submission_id" \
            --apple-id "$apple_id" \
            --team-id "$team_id" \
            --password "$password" \
            --output-format json >"$info_file" 2>/dev/null || true
          status=$(jq -r '.status // empty' "$info_file" 2>/dev/null || true)
        fi

        if [[ -z "$status" ]]; then
          if [[ $submit_rc -ne 0 ]]; then
            status="SubmitFailed"
          else
            status="Unknown"
          fi
        fi

        echo "$status" > "$status_file"
        echo "notarization_status=$status" >> "$GITHUB_OUTPUT"

        if [[ "$status" == "Accepted" ]]; then
          log "✅ Notarisation réussie — staple DMG"
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          log "✅ Staple OK: $dmg_path"
          exit 0
        fi

        if [[ "$status" == "Invalid" ]]; then
          log "❌ Notarisation rejetée (Invalid)"
          if [[ -n "$submission_id" ]]; then
            xcrun notarytool log "$submission_id" \
              --apple-id "$apple_id" \
              --team-id "$team_id" \
              --password "$password" \
              --output-format json || true
          fi
          exit 1
        fi

        log "❌ Notarisation échouée: status='$status' rc=$submit_rc"
        exit 1
      env:
        apple_id: ${{ inputs.apple_id }}
        team_id: ${{ inputs.team_id }}
        password: ${{ inputs.password }}
        dmg_path: ${{ steps.setup.outputs.dmg_path }}
